<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 이미지 분석기</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --secondary-color: #03dac6;
            --border-color: #333;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--container-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            border: 2px dashed var(--border-color);
            display: inline-block;
            padding: 20px;
            cursor: pointer;
            text-align: center;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        .custom-file-upload:hover {
            border-color: var(--accent-color);
        }

        #preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            display: none;
            margin-top: 1rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #2c2c2c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #2c2c2c;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
            line-height: 1.6;
            border-left: 4px solid var(--secondary-color);
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 1rem;
            color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI 이미지 분석기</h1>
        
        <div class="upload-section">
            <label for="imageInput" class="custom-file-upload">
                이미지 선택 또는 드래그 (PNG, JPG)
            </label>
            <input type="file" id="imageInput" accept="image/*">
            <img id="preview" alt="미리보기">
            
            <input type="text" id="promptInput" placeholder="이미지에 대해 궁금한 점을 입력하세요 (예: 이 사진에 무엇이 있나요?)">
            
            <button id="analyzeBtn">분석하기</button>
        </div>

        <div class="loader" id="loader">분석 중... 잠시만 기다려주세요.</div>
        <div id="result"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const promptInput = document.getElementById('promptInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');

        /**
         * 이미지 선택 시 미리보기를 표시합니다.
         */
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        /**
         * 분석하기 버튼 클릭 시 FastAPI 서버로 데이터를 전송합니다.
         */
        analyzeBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) {
                alert('이미지를 먼저 선택해주세요.');
                return;
            }

            // UI 상태 업데이트
            analyzeBtn.disabled = true;
            resultDiv.style.display = 'none';
            loader.style.display = 'block';

            const formData = new FormData();
            formData.append('imageFile', file);
            // 참고: 현재 backend는 prompt를 처리하지 않으나 향후 확장을 위해 포함 가능
            // formData.append('prompt', promptInput.value);

            try {
                const response = await fetch('http://localhost:8000/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('서버 응답 오류');
                }

                const data = await response.json();
                
                resultDiv.innerText = data.analysisResult;
                resultDiv.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerText = '오류 발생: ' + error.message;
                resultDiv.style.display = 'block';
            } finally {
                analyzeBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
